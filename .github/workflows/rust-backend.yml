name: Rust backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI settings
        run: node --test tests/ui_settings.test.cjs
      - name: Format
        run: cargo fmt --manifest-path app/backend/Cargo.toml --check
      - name: Test
        run: cargo test --locked --manifest-path app/backend/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path app/backend/Cargo.toml --all-targets -- -D warnings
