<!doctype html>
<html lang="ru" data-scheme="light" data-theme="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lunaris client</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="bg.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <canvas id="wallpaper" aria-hidden="true"></canvas>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="#home"><img src="icon.png" alt=""><span>Lunaris<span class="brand-sub">client</span></span></a>
      <nav id="desktop-nav" aria-label="Основная навигация"></nav>
      <div class="sidebar-footer"><span class="version">Версия 0.8.0</span></div>
    </aside>
    <div class="workspace">
      <header><div><h1 id="page-title">Подключение</h1></div><div class="header-right"><span id="status-pill" class="status-pill">Открываем хранилище…</span><button class="icon-button" data-action="tray" aria-label="Свернуть в трей" title="Свернуть в трей" hidden></button><button class="icon-button" data-action="appearance" aria-label="Внешний вид" title="Внешний вид"></button></div></header>
      <main id="view" tabindex="-1"><div class="loading"><span class="spinner"></span>Открываем защищённое хранилище…</div></main>
    </div>
    <nav id="mobile-nav" aria-label="Основная навигация"></nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Закрыть">×</button></div><div id="dialog-body"></div><p id="dialog-error" role="alert"></p><div id="dialog-actions"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
